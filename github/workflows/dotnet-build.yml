name: CI Workflow
on:
  push:
  branches:
  - main # Substitua pelo nome da sua branch principal
schedule:
  - cron: '0 * * * *' # Executa a cada hora (no formato cron)

jobs:
  build:
  runs-on: ubuntu-latest

steps:
  # Checkout do código
  - name: Check out repository code
uses: actions/checkout@v3

# Configurar e instalar dependências do .NET
- name: Setup .NET
uses: actions/setup-dotnet@v3
with:
  dotnet-version: '7.0' # Substitua pela versão do .NET usada no projeto

# Restaurar dependências
- name: Restore dependencies
run: dotnet restore ./github4women/github4women.csproj

# Build do projeto
- name: Build the project
run: dotnet build ./github4women/github4women.csproj --no-restore --configuration Release

# Executar testes (opcional)
- name: Run tests
run: dotnet test ./github4women/github4women.csproj --no-build --verbosity normal